name: Seed exact portfolio snapshot

on:
  push:
    paths:
      - ".github/workflows/seed-work-sandbox.yml"

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy work-sandbox snapshot
        shell: bash
        run: |
          set -euxo pipefail
          TMP=$(mktemp -d)
          git clone --depth 1 --branch work-sandbox https://github.com/manioudakiefpraxia-maker/mike-androulakis-portfolio.git "$TMP/source"
          rsync -a --delete --exclude='.git' "$TMP/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Seed portfolio from work-sandbox"
          git push
