          base="https://mike-androulakis-portfolio.iomi36.chatgpt.site/"
          def blob_sha(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          for p, meta in manifest.items():
              out=pathlib.Path(p)
              if out.exists():
                  cur=out.read_bytes()
                  if len(cur)==meta["size"] and blob_sha(cur)==meta["sha"]:
                      print("already exact",p)
                      continue
              rel=p[len("dist/"):]
              url=base+urllib.parse.quote(rel,safe="/")
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=120) as r:
                          data=r.read()
                      got=blob_sha(data)
                      if len(data)!=meta["size"] or got!=meta["sha"]:
                          raise RuntimeError(f"hash/size mismatch for {p}: size={len(data)} sha={got}")
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(data)
                      print("verified",p,len(data),got)
                      last=None
                      break
                  except Exception as e:
                      last=e
                      time.sleep(2*(attempt+1))
              if last is not None:
                  raise last
          
          PY
      - name: Commit verified binaries
