name: Sync exact uploaded portfolio
on:
  push:
    paths:
      - ".github/workflows/sync-exact-upload.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact uploaded snapshot
        run: |
          import base64, json, os, pathlib, shutil, time, urllib.parse, urllib.request
          manifest = ["dist/aerium/campaign.webp","dist/aerium/catalogue.webp","dist/aerium/components.webp","dist/aerium/index.html","dist/aerium/material-library.webp","dist/aerium/posters.webp","dist/aerium/product.webp","dist/afterhours/index.html","dist/afterhours/visuals/01.webp","dist/afterhours/visuals/02.webp","dist/afterhours/visuals/03.webp","dist/afterhours/visuals/04.webp","dist/afterhours/visuals/05.webp","dist/afterhours/visuals/06.webp","dist/afterhours/visuals/07.webp","dist/afterhours/visuals/08.webp","dist/afterhours/visuals/09-poster-wall.webp","dist/afterhours/visuals/10-night-installation.webp","dist/afterhours/visuals/11-night-kit.webp","dist/apex-racing/graphic-hero.webp","dist/apex-racing/identity-kit.webp","dist/apex-racing/index.html","dist/apex-racing/pit-environment.webp","dist/apex-racing/posters.webp","dist/apex-racing/social-system.webp","dist/css/home.css","dist/cue/cue.css","dist/cue/index.html","dist/cue/venue-planning.webp","dist/cv/cv.css","dist/cv/cv.js","dist/cv/index.html","dist/daily-form/index.html","dist/daily-form/visuals/02.webp","dist/daily-form/visuals/03.webp","dist/daily-form/visuals/04.webp","dist/daily-form/visuals/05.webp","dist/daily-form/visuals/06.webp","dist/daily-form/visuals/07.webp","dist/daily-form/visuals/08.webp","dist/daily-form/visuals/09-brand-system.webp","dist/daily-form/visuals/10-morning-collection.webp","dist/daily-form/visuals/11-retail.webp","dist/Deep Space Drones.mp3","dist/forma/forma-v2.css","dist/forma/graphic-hero.webp","dist/forma/index.html","dist/forma/publication.webp","dist/forma/wayfinding.webp","dist/graphic-expansion.css","dist/ichnos/graphic-v4/01-hero.webp","dist/ichnos/graphic-v4/02-identity.webp","dist/ichnos/graphic-v4/03-posters.webp","dist/ichnos/graphic-v4/04-packaging.webp","dist/ichnos/graphic-v4/05-editorial.webp","dist/ichnos/graphic-v4/06-architecture.webp","dist/ichnos/graphic-v4/07-closing.webp","dist/ichnos/ichnos-v4.css","dist/ichnos/index.html","dist/index.html","dist/js/app.js","dist/js/audio.js","dist/js/bio.js","dist/js/hero.js","dist/js/menu.js","dist/js/particles.js","dist/js/scroll.js","dist/morph/digital-campaign.webp","dist/morph/graphic-hero.webp","dist/morph/identity-kit.webp","dist/morph/index.html","dist/morph/packaging.webp","dist/morph/posters.webp","dist/null-vector/08-navigation-chamber.webp","dist/null-vector/collectors.webp","dist/null-vector/field-kit.webp","dist/null-vector/hud.webp","dist/null-vector/index.html","dist/null-vector/key-art.webp","dist/null-vector/poster.webp","dist/offgrid/index.html","dist/offgrid/offgrid-black.css","dist/offgrid/offgrid-logo-light.svg","dist/offgrid/visuals/01.webp","dist/offgrid/visuals/02.webp","dist/offgrid/visuals/03.png","dist/offgrid/visuals/05.webp","dist/offgrid/visuals/06.webp","dist/offgrid/visuals/07.webp","dist/offgrid/visuals/08.webp","dist/offgrid/visuals/09-graphic-system.webp","dist/offgrid/visuals/10-expedition-hero.webp","dist/offgrid/visuals/11-field-kit.webp","dist/on-air/index.html","dist/on-air/onair-v2.css","dist/on-air/visuals/01.webp","dist/on-air/visuals/02.webp","dist/on-air/visuals/03-lower-third.svg","dist/on-air/visuals/04-now-next.svg","dist/on-air/visuals/05.webp","dist/on-air/visuals/06.webp","dist/on-air/visuals/07.webp","dist/on-air/visuals/08-signoff.svg","dist/on-air/visuals/09-broadcast-system.webp","dist/on-air/visuals/10-studio.webp","dist/on-air/visuals/hero-v2.webp","dist/project-directions.css","dist/project-safe.css","dist/relay/index.html","dist/relay/relay-v2.css","dist/relay/visuals/01.webp","dist/relay/visuals-v2/01-hero.webp","dist/relay/visuals-v2/03-poster.webp","dist/relay/visuals-v2/04-mobile.webp","dist/relay/visuals-v2/05-installation.webp","dist/relay/visuals-v2/06-print-kit.webp","dist/relay/visuals-v2/07-closing.webp","dist/trio-extra.css","dist/trio.css","dist/worlds-v2.css","dist/worlds.css"]
          roots = {".github/workflows/import-current-site.yml":"",".gitignore":"LnNpdGVzLXJ1bnRpbWUvCg==",".openai/hosting.json":"ewogICJzdGF0aWMiOiB7CiAgICAiZGlyZWN0b3J5IjogImRpc3QiCiAgfSwKICAicHJvamVjdF9pZCI6ICJhcHBncHJqXzZhYTU1MDRhN2I3YzgxOTE5OWZhMTQ0NTFiNmEwYWMwIgp9Cg==","dist/.vscode/settings.json":"ew0KICAgICJjaGF0LnRvb2xzLnRlcm1pbmFsLmF1dG9BcHByb3ZlIjogew0KICAgICAgICAicHl0aG9uLmV4ZSI6IHRydWUNCiAgICB9DQp9","package.json":"","README.md":""}
          base = "https://mike-androulakis-portfolio.iomi36.chatgpt.site/"
          shutil.rmtree("dist", ignore_errors=True)
          for p in manifest:
              rel = p[len("dist/"):]
              url = base + urllib.parse.quote(rel, safe="/")
              out = pathlib.Path(p)
              out.parent.mkdir(parents=True, exist_ok=True)
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          data = r.read()
                      out.write_bytes(data)
                      print(f"{p} <- {len(data)} bytes")
                      last = None
                      break
                  except Exception as e:
                      last = e
                      time.sleep(2 * (attempt + 1))
              if last is not None:
                  raise last
          for p, b64 in roots.items():
              out = pathlib.Path(p)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(base64.b64decode(b64))
              print(f"restored {p}")
          
      - name: Commit uploaded snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync uploaded portfolio snapshot"
          git push
