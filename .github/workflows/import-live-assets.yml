          2e5fbea1cab100d1797be1cce403341a02ef0643	dist/relay/visuals-v2/07-closing.webp
          EOF
          ok=0
          fail=0
          while IFS=$'\t' read -r expected path; do
            rel="${path#dist/}"
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$rel")
            tmp=$(mktemp)
            if curl -fsSL --retry 2 "$BASE/$encoded" -o "$tmp"; then
              actual=$(git hash-object "$tmp")
              if [ "$actual" = "$expected" ]; then
                mkdir -p "$(dirname "$path")"
                mv "$tmp" "$path"
                echo "OK $path"
                ok=$((ok+1))
              else
                echo "MISMATCH $path expected=$expected actual=$actual"
                rm -f "$tmp"
                fail=$((fail+1))
              fi
            else
              echo "MISSING $path"
              rm -f "$tmp"
              fail=$((fail+1))
            fi
          done < /tmp/manifest.tsv
          echo "verified=$ok failed=$fail"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Import verified portfolio assets"
          git pull --rebase origin main
          git push
