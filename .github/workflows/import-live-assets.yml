name: Import verified portfolio assets

on:
  push:
    paths:
      - ".github/workflows/import-live-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download only byte-identical assets
