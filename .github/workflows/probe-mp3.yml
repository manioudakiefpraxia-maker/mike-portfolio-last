name: Probe Suno prepared MP3

on:
  push:
    paths:
      - ".github/workflows/probe-mp3.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official download endpoint
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://studio-api-prod.suno.com/api/download/clip/7ad91fb1-dbe0-45a1-b58c-bca1959af508?format=mp3"
          curl -sS -L -D /tmp/headers.txt -o /tmp/body.bin -w 'HTTP=%{http_code}\nFINAL=%{url_effective}\nSIZE=%{size_download}\nTYPE=%{content_type}\n' "$URL" || true
          cat /tmp/headers.txt
          wc -c /tmp/body.bin || true
          file /tmp/body.bin || true
          git hash-object /tmp/body.bin || true
          head -c 500 /tmp/body.bin | strings || true
