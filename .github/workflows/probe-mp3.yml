name: Probe portfolio audio source

on:
  push:
    paths:
      - ".github/workflows/probe-mp3.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download Suno media source
        shell: bash
        run: |
          set -euxo pipefail
          ID="7ad91fb1-dbe0-45a1-b58c-bca1959af508"
          curl -fsSL -A "Mozilla/5.0" "https://studio-api-prod.suno.com/api/clip/$ID" -o /tmp/meta.json
          MEDIA=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/meta.json'))
          print(d['media_urls'][0]['url'])
          PY
          )
          echo "$MEDIA"
          curl -fL --retry 2 -A "Mozilla/5.0" -H "Referer: https://suno.com/" "$MEDIA" -o /tmp/source.m4a
          wc -c /tmp/source.m4a
          file /tmp/source.m4a
          sha256sum /tmp/source.m4a
          ffprobe -v error -show_format -show_streams /tmp/source.m4a || true
