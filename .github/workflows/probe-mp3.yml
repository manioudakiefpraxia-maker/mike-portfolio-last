name: Probe portfolio audio source

on:
  push:
    paths:
      - ".github/workflows/probe-mp3.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect audio
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 2 "https://cdn1.suno.ai/7ad91fb1-dbe0-45a1-b58c-bca1959af508.mp3" -o /tmp/audio.mp3
          wc -c /tmp/audio.mp3
          git hash-object /tmp/audio.mp3
