name: Probe portfolio audio source

on:
  push:
    paths:
      - ".github/workflows/probe-mp3.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect audio
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 2 "https://mike-androulakis-portfolio.iomi36.chatgpt.site/Deep%20Space%20Drones.mp3" -o /tmp/audio.mp3
          wc -c /tmp/audio.mp3
          git hash-object /tmp/audio.mp3
