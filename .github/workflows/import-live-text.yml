name: Import verified portfolio text

on:
  push:
    paths:
      - ".github/workflows/import-live-text.yml"

permissions:
  contents: write

jobs:
  import-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download byte-identical text files
        shell: bash
        env:
          BASE: https://mike-androulakis-portfolio.iomi36.chatgpt.site
        run: |
          set -u
          cat > /tmp/manifest.tsv <<'EOF'
          6ca496614d4ee5c5801cc2264707f39d26c4ed17	dist/.vscode/settings.json
          01d24a9ecbbdd4b9eb2ab9afecb74dba0eec6d54	dist/aerium/index.html
          9e6c5a0292b1786cbb2fcdce31fecdf77670dea7	dist/afterhours/index.html
          a60a0dd31dd609fa489eda253c8f754f7b345d29	dist/apex-racing/index.html
          d640ed2769e7c3475c85c3afa6436e9fe11cddb5	dist/css/home.css
          c6a66fef601c6350e65cd673f8889a9aea96cef0	dist/cue/cue.css
          f43a28f231d3cf45e4d4f05be8657c8a392c26b3	dist/cue/index.html
          9d71c9b4986ce72f9482c8d94c246eea081ac202	dist/cv/cv.css
          e386ef3b580e3f55bdbbb277dfdd1fd29f5ad525	dist/cv/cv.js
          4444b7850d6e4a11d55c0e53521010f46c956546	dist/cv/index.html
          91255c73a58c1a3fe8ae2f78d316a4f3fb90ecd1	dist/daily-form/index.html
          5a2612d6033dc36167972bd2a41b58fc8685309c	dist/forma/forma-v2.css
          a57213cd4ae53c8e6a39154f9d91cfc0654ecf07	dist/forma/index.html
          7ddc5a094a225888c8a758ef47f134ad9c5102c3	dist/graphic-expansion.css
          10f5613f9d2d21955e4cfc0dedcbfb81bcb29ad9	dist/ichnos/ichnos-v4.css
          403c340d868258b07fa2990f46286ea947d05e8c	dist/ichnos/index.html
          5f53afebbf43cc7ee862e4ee1b6269ae480bfcd7	dist/index.html
          e4b1634d9c96f1690061efd47bac0e14ea225f54	dist/js/app.js
          fb34f8bc96e42871eab82aebeaf0161f80bfab8d	dist/js/audio.js
          76d797278ca21c889f421f11c9d0dcf6b3128a13	dist/js/bio.js
          4b173c4bb69e608767fc2bd94835e700e14f2ed1	dist/js/hero.js
          c48cd39fa03a2aa59d712fdfc6832089acf98a37	dist/js/menu.js
          567a63b20bb0002869b8d0da962cc0363fc8ae1d	dist/js/particles.js
          d029a6a6cafc9109d312b46e54210d559dff4590	dist/js/scroll.js
          e7b2fc289525a64939d81f4babe3d623f7e4f7ea	dist/morph/index.html
          5fb861e6d1b4d7417347bad5b5d0c417ca22a82f	dist/null-vector/index.html
          32b49f83b5215b172fc05bd5a86e083589d040e7	dist/offgrid/index.html
          54df61ab69a2537186694b0358ea7a3583e5c43b	dist/offgrid/offgrid-black.css
          47694f119692c915e1f51dace7739eb447665b51	dist/offgrid/offgrid-logo-light.svg
          0e5c7e3a19d76db9c064f06934e9f0c8988576e1	dist/on-air/index.html
          1c98eb6c8c895ac23fc87e98ce502362d98d3a44	dist/on-air/onair-v2.css
          7b4dda785478d2bef2a17a7c6ac94ed3592670b6	dist/on-air/visuals/03-lower-third.svg
          089d1eb46ce5d90aae076a3835af787269b56f3d	dist/on-air/visuals/04-now-next.svg
          574d1954d0905b57494131b6ad308c8d06c0fffc	dist/on-air/visuals/08-signoff.svg
          c9d5dc2751838beaa71b5f16c2e869550bc6d53d	dist/project-directions.css
          4c632a713357e5a2bdc34c039f02e7f16f36b159	dist/project-safe.css
          81ac53aec8ffa6cc1b24b2eeca0d41c914eaa6b4	dist/relay/index.html
          fae03ddc87cc34671910a07a2d0682a3209a3053	dist/relay/relay-v2.css
          33fed43c72d1e29d8c19fae4e4437a40b52cf50c	dist/trio-extra.css
          2604f34ba5cbed8e8bffc1948cd75ae3a4ed036a	dist/trio.css
          24a662799a78bca6d973c9403cfbe60bfe5756dd	dist/worlds-v2.css
          1824d8a74dc08fa3fc54a6917f06d60fdc23d696	dist/worlds.css
          EOF
          ok=0
          fail=0
          while IFS=$'\t' read -r expected path; do
            rel="${path#dist/}"
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$rel")
            tmp=$(mktemp)
            if curl -fsSL --retry 2 "$BASE/$encoded" -o "$tmp"; then
              actual=$(git hash-object "$tmp")
              if [ "$actual" = "$expected" ]; then
                mkdir -p "$(dirname "$path")"
                mv "$tmp" "$path"
                echo "OK $path"
                ok=$((ok+1))
              else
                echo "MISMATCH $path expected=$expected actual=$actual"
                rm -f "$tmp"
                fail=$((fail+1))
              fi
            else
              echo "MISSING $path"
              rm -f "$tmp"
              fail=$((fail+1))
            fi
          done < /tmp/manifest.tsv
          echo "verified=$ok failed=$fail"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Import verified portfolio text"
          git pull --rebase origin main
          git push
