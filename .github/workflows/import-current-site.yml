name: Import current portfolio snapshot
# Refresh live Work snapshot before preview edits

on:
  push:
    paths:
      - ".github/workflows/import-current-site.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the live portfolio
        run: |
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent --directory-prefix=mirror https://mike-androulakis-portfolio.iomi36.chatgpt.site/
          mkdir -p dist
          rsync -a --delete mirror/mike-androulakis-portfolio.iomi36.chatgpt.site/ dist/
          rm -rf mirror
      - name: Commit current site source and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Import current portfolio site"
          git push
